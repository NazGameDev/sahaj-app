name: Build Sahaj Offline Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install PyTorch and Fairseq Dependencies
      run: |
        python -m pip install "pip<24.1"
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install git+https://github.com/facebookresearch/fairseq.git

    - name: Install Application Requirements
      run: |
        pip install PyQt6 requests ai4bharat-transliteration pyinstaller

    - name: Download & Copy Extracted AI4Bharat Models
      run: |
        # Force download of the Assamese model
        python -c "from ai4bharat.transliteration import XlitEngine; XlitEngine('as', beam_width=4, rescore=False)"
        # Copy the downloaded model from the user's home directory to the cache folder
        python -c "import os, shutil; src = os.path.expanduser('~/.ai4bharat/transliteration/transformer/models/en2indic/v1.0'); os.makedirs('offline_model_cache', exist_ok=True); shutil.copytree(src, 'offline_model_cache', dirs_exist_ok=True)"

    - name: Build Executable via PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --add-data "assamese_dictionary.txt;." --add-data "dictionary.json;." --add-data "Nirmala.ttf;." --add-data "Banikanta.ttf;." --add-data "header_logo.png;." --add-data "header_icon.png;." --add-data "splash_animation.gif;." --add-data "donate_qr.png;." --add-data "offline_model_cache;offline_model_cache" main.py

    - name: Zip Final Build Folder
      run: |
        Compress-Archive -Path dist/main/* -DestinationPath Sahaj_v1_1_Offline.zip

    - name: Upload Compressed Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sahaj_v1_1_Offline_Windows
        path: Sahaj_v1_1_Offline.zip
